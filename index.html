<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroWeather Dashboard + Live ATIS & METAR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6">

    <div class="max-w-6xl mx-auto mb-4 text-center md:text-left border-b border-slate-900 pb-3">
        <h1 class="text-2xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-sky-400 bg-clip-text text-transparent">
            AeroWeather Dashboard
        </h1>
    </div>

    <!-- Schmalere Grid-Container-Breite (max-w-6xl) -->
    <div id="dashboard-grid" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
        <!-- Lade-Skelette -->
        <div class="animate-pulse bg-slate-900/40 border border-slate-800 rounded-2xl p-4 h-[500px]"></div>
        <div class="animate-pulse bg-slate-900/40 border border-slate-800 rounded-2xl p-4 h-[500px]"></div>
        <div class="animate-pulse bg-slate-900/40 border border-slate-800 rounded-2xl p-4 h-[500px]"></div>
    </div>

    <script>
        const AIRPORTS = [
            { code: 'FMO', icao: 'EDDG', name: 'Münster/Osnabrück', lat: 52.1346, lon: 7.6848, radar: 'https://www.airnavradar.com/@51.87622,7.56951,z11' },
            { code: 'AMS', icao: 'EHAM', name: 'Amsterdam Schiphol', lat: 52.3105, lon: 4.7683, radar: 'https://www.airnavradar.com/@52.31562,4.79260,z12' },
            { code: 'FRA', icao: 'EDDF', name: 'Frankfurt', lat: 50.0379, lon: 8.5622, radar: 'https://www.airnavradar.com/@50.02613,8.52720,z12' },
            { code: 'CGN', icao: 'EDDK', name: 'Köln/Bonn', lat: 50.8659, lon: 7.1427, radar: 'https://www.airnavradar.com/@50.88624,7.22096,z12' },
            { code: 'DUS', icao: 'EDDL', name: 'Düsseldorf', lat: 51.2895, lon: 6.7668, radar: 'https://www.airnavradar.com/@51.27170,6.80569,z12' },
            { code: 'BRU', icao: 'EBBR', name: 'Brüssel-Zaventem', lat: 50.9008, lon: 4.4856, radar: 'https://www.airnavradar.com/@50.90216,4.50523,z13' },
            { code: 'LGG', icao: 'EBLG', name: 'Lüttich', lat: 50.6374, lon: 5.4432, radar: 'https://www.airnavradar.com/@50.62556,5.43570,z11' },
            { code: 'MUC', icao: 'EDDM', name: 'München', lat: 48.3538, lon: 11.7861, radar: 'https://www.airnavradar.com/@48.36501,11.79689,z12' },
            { code: 'ZRH', icao: 'LSZH', name: 'Zürich', lat: 47.4582, lon: 8.5554, radar: 'https://www.airnavradar.com/@47.46179,8.55704,z12' },
            { code: 'LHR', icao: 'EGLL', name: 'London Heathrow', lat: 51.4700, lon: -0.4543, radar: 'https://www.airnavradar.com/@51.46499,-0.41695,z12' },
            { code: 'PMI', icao: 'LEPA', name: 'Palma de Mallorca', lat: 39.5517, lon: 2.7388, radar: 'https://www.airnavradar.com/@39.55992,2.69767,z12' }
        ];

        const WEEKDAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

        const getWindDirectionLabel = (deg) => {
            const directions = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(deg / 45) % 8;
            return directions[index];
        };

        const parseMetarWind = (metarStr) => {
            if (!metarStr) return null;
            const match = metarStr.match(/\b(VRB|\d{3})(\d{2,3})(G\d{2,3})?KT\b/);
            if (match) {
                const dirStr = match[1];
                const speedKt = parseInt(match[2], 10);
                const dir = dirStr === 'VRB' ? null : parseInt(dirStr, 10);
                const speedKmh = Math.round(speedKt * 1.852);
                return { dir, speedKmh, speedKt };
            }
            return null;
        };

        const parseAtisRunways = (atisText) => {
            if (!atisText) return null;
            let landing = null, takeoff = null;

            const arrMatch = atisText.match(/(?:ARR|ARRIVALS?|LANDING|EXPECT|ILS)\s+(?:RWY|RUNWAY|RUNWAYS)?\s*([0-3][0-9][LCR]?)/i);
            if (arrMatch) landing = arrMatch[1];

            const depMatch = atisText.match(/(?:DEP|DEPARTURES?|TAKEOFF)\s+(?:RWY|RUNWAY|RUNWAYS)?\s*([0-3][0-9][LCR]?)/i);
            if (depMatch) takeoff = depMatch[1];

            const inUseMatch = atisText.match(/(?:RUNWAY IN USE|RWY IN USE)\s*([0-3][0-9][LCR]?)/i);
            if (inUseMatch) {
                if (!landing) landing = inUseMatch[1];
                if (!takeoff) takeoff = inUseMatch[1];
            }

            if (landing || takeoff) {
                return { landing: landing || "Siehe ATIS", takeoff: takeoff || "Siehe ATIS" };
            }
            return null;
        };

        const getActiveRunwaysFallback = (airportCode, windDirection, windSpeedKt = 5) => {
            if (windDirection === null || windDirection === undefined) {
                return { landing: "Standard", takeoff: "Standard" };
            }

            const getDiff = (deg1, deg2) => {
                let diff = Math.abs(deg1 - deg2) % 360;
                return diff > 180 ? 360 - diff : diff;
            };

            switch (airportCode) {
                case 'FMO':
                    return getDiff(windDirection, 68) < getDiff(windDirection, 248)
                        ? { landing: "07", takeoff: "07" }
                        : { landing: "25", takeoff: "25" };

                case 'AMS':
                    if (windDirection >= 140 && windDirection <= 240) {
                        return { landing: "18R / 18C", takeoff: "24 / 18L" };
                    } else if (windDirection > 240 && windDirection <= 330) {
                        return { landing: "27 / 18R", takeoff: "24 / 36L" };
                    } else if (windDirection > 330 || windDirection <= 050) {
                        return { landing: "36R / 36C", takeoff: "36L" };
                    } else {
                        return { landing: "06", takeoff: "09" };
                    }

                case 'FRA':
                    return getDiff(windDirection, 69) < getDiff(windDirection, 249)
                        ? { landing: "07L/R", takeoff: "07C/18" }
                        : { landing: "25L/R", takeoff: "25C/18" };

                case 'CGN':
                    if (windDirection >= 200 && windDirection <= 290) {
                        return { landing: "24 / 31R", takeoff: "24 / 31R" };
                    } else if (windDirection >= 291 && windDirection <= 350) {
                        return { landing: "31R", takeoff: "31R" };
                    } else if (windDirection >= 20 && windDirection <= 110) {
                        return { landing: "06 / 13L", takeoff: "06 / 13L" };
                    } else {
                        return { landing: "13L", takeoff: "13L" };
                    }

                case 'DUS':
                    return getDiff(windDirection, 53) < getDiff(windDirection, 233)
                        ? { landing: "05R", takeoff: "05R" }
                        : { landing: "23L", takeoff: "23L" };

                case 'BRU':
                    if (windDirection >= 315 || windDirection < 45) return { landing: "01", takeoff: "01" };
                    return getDiff(windDirection, 66) < getDiff(windDirection, 246)
                        ? { landing: "07L", takeoff: "07R" }
                        : { landing: "25L", takeoff: "25R" };

                case 'LGG':
                    return getDiff(windDirection, 44) < getDiff(windDirection, 224)
                        ? { landing: "04R", takeoff: "04L" }
                        : { landing: "22L", takeoff: "22R" };

                case 'MUC':
                    return getDiff(windDirection, 83) < getDiff(windDirection, 263)
                        ? { landing: "08L/R", takeoff: "08L/R" }
                        : { landing: "26L/R", takeoff: "26L/R" };

                case 'ZRH':
                    // LSZH Pisten: 14/32, 16/34, 10/28
                    if (windDirection >= 210 && windDirection <= 310) {
                        return { landing: "28 / 34", takeoff: "28 / 32" };
                    } else if (windDirection > 310 || windDirection <= 30) {
                        return { landing: "34", takeoff: "32" };
                    } else {
                        return { landing: "14", takeoff: "16 / 28" };
                    }

                case 'LHR':
                    return getDiff(windDirection, 90) < getDiff(windDirection, 270)
                        ? { landing: "09L", takeoff: "09R" }
                        : { landing: "27R", takeoff: "27L" };

                case 'PMI':
                    return getDiff(windDirection, 60) < getDiff(windDirection, 240)
                        ? { landing: "06L/R", takeoff: "06L/R" }
                        : { landing: "24L/R", takeoff: "24L/R" };

                default:
                    return { landing: "n.a.", takeoff: "n.a." };
            }
        };

        async function fetchMetar(icao) {
            try {
                const res = await fetch(`https://metar.vatsim.net/${icao}`);
                if (res.ok) {
                    const text = (await res.text()).trim();
                    if (text && text.length > 5) return text;
                }
            } catch (e) {}

            try {
                const res = await fetch(`https://aviationweather.gov/api/data/metar?ids=${icao}`);
                if (res.ok) {
                    const text = (await res.text()).trim();
                    if (text && text.length > 5) return text;
                }
            } catch (e) {}

            return null;
        }

        async function fetchVatsimAtis() {
            try {
                const res = await fetch('https://data.vatsim.net/v3/vatsim-data.json');
                if (res.ok) {
                    const data = await res.json();
                    return data.atis || [];
                }
            } catch (e) {
                console.warn("Konnte VATSIM ATIS Feed nicht laden", e);
            }
            return [];
        }

        async function loadWeatherData() {
            const grid = document.getElementById('dashboard-grid');

            try {
                const latitudes = AIRPORTS.map(ap => ap.lat).join(',');
                const longitudes = AIRPORTS.map(ap => ap.lon).join(',');
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitudes}&longitude=${longitudes}&current=temperature_2m,cloud_cover,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,sunshine_duration&hourly=cloud_cover,wind_speed_10m,wind_direction_10m,precipitation_probability&timezone=Europe%2FBerlin&forecast_days=6`;

                const response = await fetch(url);
                const data = await response.json();
                const atisList = await fetchVatsimAtis();

                grid.innerHTML = '';

                for (let idx = 0; idx < AIRPORTS.length; idx++) {
                    const ap = AIRPORTS[idx];
                    const apDaily = Array.isArray(data) ? data[idx].daily : data.daily;
                    const apHourly = Array.isArray(data) ? data[idx].hourly : data.hourly;
                    const apCurrent = Array.isArray(data) ? data[idx].current : data.current;
                    
                    const liveTemp = Math.round(apCurrent.temperature_2m);
                    const liveCloud = Math.round(apCurrent.cloud_cover);

                    let currentWindDir = apCurrent.wind_direction_10m;
                    let currentWindSpeedKmh = Math.round(apCurrent.wind_speed_10m);
                    let currentWindSpeedKt = Math.round(currentWindSpeedKmh / 1.852);

                    // ATIS-Button
                    const icaoBadge = `
                        <a href="https://atis.guru/atis/${ap.icao}" target="_blank" title="ATIS für ${ap.icao} auf atis.guru öffnen" class="text-xs font-bold text-sky-400 hover:text-white bg-slate-900 hover:bg-sky-600 border border-sky-500/50 hover:border-sky-400 px-2 py-0.5 rounded-md transition-all duration-200 flex items-center justify-between gap-1 group shadow-lg shadow-sky-950/50">
                            <span>${ap.icao}</span>
                            <span class="text-[10px] opacity-70 group-hover:translate-x-0.5 transition-transform">↗</span>
                        </a>
                    `;

                    // RADAR-Button für alle Flughäfen
                    const radarBadge = `
                        <a href="${ap.radar}" target="_blank" title="Radar für ${ap.code} auf AirNavRadar öffnen" class="text-xs font-bold text-emerald-400 hover:text-white bg-slate-900 hover:bg-emerald-600 border border-emerald-500/50 hover:border-emerald-400 px-2 py-0.5 rounded-md transition-all duration-200 flex items-center justify-between gap-1 group shadow-lg shadow-emerald-950/50">
                            <span>RADAR</span>
                            <span class="text-[10px] opacity-70 group-hover:translate-x-0.5 transition-transform">↗</span>
                        </a>
                    `;

                    const card = document.createElement('div');
                    card.className = "bg-slate-900/50 border-2 border-slate-800 rounded-2xl p-3.5 hover:border-indigo-500/50 transition-all duration-300 backdrop-blur-md flex flex-col justify-between shadow-2xl";

                    let cardHtml = `
                        <div>
                            <div class="flex justify-between items-center mb-2 border-b-2 border-slate-800 pb-1.5">
                                <h2 class="text-xl font-black text-white flex items-center gap-1.5">
                                    ${ap.code}
                                    <span class="text-sm font-normal text-slate-400">/ ${ap.name}</span>
                                </h2>
                                <div class="flex flex-col gap-1 items-end">
                                    ${icaoBadge}
                                    ${radarBadge}
                                </div>
                            </div>

                            <div class="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800 text-sm mb-2.5 space-y-1.5">
                                <div class="flex items-center justify-between text-slate-200 font-semibold bg-slate-900/80 px-2 py-1 rounded border border-slate-800/80">
                                    <div class="flex items-center gap-1 text-sky-400">
                                        <span>🛬</span>
                                        <span class="text-xs uppercase text-slate-300 font-bold">LDG:</span>
                                        <span id="runway-landing-${ap.icao}" class="text-slate-100 font-bold">...</span>
                                    </div>
                                    <span class="text-slate-600">|</span>
                                    <div class="flex items-center gap-1 text-indigo-400">
                                        <span>🛫</span>
                                        <span class="text-xs uppercase text-slate-300 font-bold">TKOF:</span>
                                        <span id="runway-takeoff-${ap.icao}" class="text-slate-100 font-bold">...</span>
                                    </div>
                                </div>

                                <div class="pt-1 flex items-center justify-between text-slate-200 text-xs font-medium px-0.5">
                                    <div class="flex items-center gap-1"><span>🌡️</span><span>${liveTemp}°C</span></div>
                                    <div class="flex items-center gap-1"><span>☁️</span><span>${liveCloud}%</span></div>
                                    <div id="live-wind-${ap.icao}" class="flex items-center gap-1 text-sky-300">
                                        <span class="inline-block" style="transform: rotate(${currentWindDir}deg);">↑</span>
                                        <span>${getWindDirectionLabel(currentWindDir)} ${currentWindSpeedKmh} km/h</span>
                                    </div>
                                </div>

                                <div class="pt-1 text-[11px]">
                                    <div id="metar-${ap.icao}" class="font-mono bg-slate-900/90 p-1.5 rounded text-slate-300 leading-tight break-all border border-slate-800/80 animate-pulse whitespace-pre-wrap">
                                        Lade METAR...
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-1.5">
                    `;

                    for (let dayIdx = 0; dayIdx < 6; dayIdx++) {
                        const dateObj = new Date(apDaily.time[dayIdx]);
                        const dayName = dayIdx === 0 ? "Heute" : WEEKDAYS[dateObj.getDay()];
                        const sunHours = (apDaily.sunshine_duration[dayIdx] / 3600).toFixed(1);
                        const tempMax = Math.round(apDaily.temperature_2m_max[dayIdx]);

                        const dayHourlyStart = dayIdx * 24;
                        const morningHours = [8, 9, 10, 11, 12];
                        const afternoonHours = [13, 14, 15, 16, 17, 18];

                        let vCloudSum = 0, vWindSum = 0, vWindDirSum = 0, vRainMax = 0;
                        morningHours.forEach(h => {
                            vCloudSum += apHourly.cloud_cover[dayHourlyStart + h] || 0;
                            vWindSum += apHourly.wind_speed_10m[dayHourlyStart + h] || 0;
                            vWindDirSum += apHourly.wind_direction_10m[dayHourlyStart + h] || 0;
                            vRainMax = Math.max(vRainMax, apHourly.precipitation_probability[dayHourlyStart + h] || 0);
                        });

                        let nCloudSum = 0, nWindSum = 0, nWindDirSum = 0, nRainMax = 0;
                        afternoonHours.forEach(h => {
                            nCloudSum += apHourly.cloud_cover[dayHourlyStart + h] || 0;
                            nWindSum += apHourly.wind_speed_10m[dayHourlyStart + h] || 0;
                            nWindDirSum += apHourly.wind_direction_10m[dayHourlyStart + h] || 0;
                            nRainMax = Math.max(nRainMax, apHourly.precipitation_probability[dayHourlyStart + h] || 0);
                        });

                        const vCloudAvg = Math.round(vCloudSum / 5);
                        const nCloudAvg = Math.round(nCloudSum / 6);

                        let dayColorClass = "text-slate-100 font-extrabold";
                        let dayBadge = "";

                        if (vCloudAvg <= 25 && nCloudAvg <= 25) {
                            dayColorClass = "text-emerald-400 font-black";
                            dayBadge = ' <span class="text-xs">☀️</span>';
                        }

                        cardHtml += `
                            <div class="border-b border-slate-800/40 pb-1 last:border-0 last:pb-0">
                                <div class="flex justify-between items-center text-sm mb-0.5">
                                    <span class="${dayColorClass}">${dayName}${dayBadge}</span>
                                    <div class="flex gap-3 text-xs text-slate-300">
                                        <span>☀️ ${sunHours}h</span>
                                        <span class="text-slate-200 font-semibold">${tempMax}°C</span>
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 gap-0.5 text-[12px] text-slate-300 font-medium pl-1">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] text-slate-400 font-black w-3 text-left">V</span>
                                        <span class="w-14 text-left">☁️ ${vCloudAvg}%</span>
                                        <span class="w-14 text-left text-blue-400 font-semibold">💧 ${vRainMax}%</span>
                                        <span class="w-24 text-right text-sky-400 flex items-center justify-end gap-1">
                                            <span class="inline-block" style="transform: rotate(${Math.round(vWindDirSum/5)}deg);">↑</span>
                                            <span>${getWindDirectionLabel(Math.round(vWindDirSum/5))} ${Math.round(vWindSum/5)} km/h</span>
                                        </span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] text-slate-400 font-black w-3 text-left">N</span>
                                        <span class="w-14 text-left">☁️ ${nCloudAvg}%</span>
                                        <span class="w-14 text-left text-blue-400 font-semibold">💧 ${nRainMax}%</span>
                                        <span class="w-24 text-right text-sky-300 flex items-center justify-end gap-1">
                                            <span class="inline-block" style="transform: rotate(${Math.round(nWindDirSum/6)}deg);">↑</span>
                                            <span>${getWindDirectionLabel(Math.round(nWindDirSum/6))} ${Math.round(nWindSum/6)} km/h</span>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    cardHtml += `</div></div>`;
                    card.innerHTML = cardHtml;
                    grid.appendChild(card);

                    // Standard-Fallback setzen
                    const initRunways = getActiveRunwaysFallback(ap.code, currentWindDir, currentWindSpeedKt);
                    document.getElementById(`runway-landing-${ap.icao}`).innerText = initRunways.landing;
                    document.getElementById(`runway-takeoff-${ap.icao}`).innerText = initRunways.takeoff;

                    // VATSIM ATIS Check
                    const stationAtis = atisList.find(a => a.callsign && a.callsign.startsWith(ap.icao));
                    if (stationAtis && stationAtis.text_atis) {
                        const parsedAtisRunways = parseAtisRunways(stationAtis.text_atis.join(' '));
                        if (parsedAtisRunways) {
                            document.getElementById(`runway-landing-${ap.icao}`).innerText = parsedAtisRunways.landing;
                            document.getElementById(`runway-takeoff-${ap.icao}`).innerText = parsedAtisRunways.takeoff;
                        }
                    }

                    // METAR Abruf
                    fetchMetar(ap.icao).then((metar) => {
                        const metarEl = document.getElementById(`metar-${ap.icao}`);
                        const windEl = document.getElementById(`live-wind-${ap.icao}`);

                        if (metarEl) {
                            metarEl.classList.remove('animate-pulse');
                            metarEl.innerText = metar || "Kein METAR verfügbar";
                        }

                        if (metar) {
                            const parsedWind = parseMetarWind(metar);
                            if (parsedWind && parsedWind.dir !== null) {
                                const realRunways = getActiveRunwaysFallback(ap.code, parsedWind.dir, parsedWind.speedKt);
                                document.getElementById(`runway-landing-${ap.icao}`).innerText = realRunways.landing;
                                document.getElementById(`runway-takeoff-${ap.icao}`).innerText = realRunways.takeoff;

                                windEl.innerHTML = `
                                    <span class="inline-block" style="transform: rotate(${parsedWind.dir}deg);">↑</span>
                                    <span>${getWindDirectionLabel(parsedWind.dir)} ${parsedWind.speedKmh} km/h (${parsedWind.speedKt}kt)</span>
                                `;
                            }
                        }
                    });
                }
            } catch (error) {
                console.error("Fehler beim Laden:", error);
            }
        }

        loadWeatherData();
    </script>
</body>
</html>
